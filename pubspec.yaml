name: levelup_fis
description: Plataforma gamificada de ensino de física.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gerenciamento de estado
  flutter_riverpod: ^2.5.1

  # Navegação
  go_router: ^13.2.0

  # Requisições HTTP
  http: ^1.2.1

  # Fontes
  google_fonts: ^6.2.1

  # Variáveis de ambiente
  flutter_dotenv: ^5.1.0

  # Ícones extras
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

  # Checagem de conectividade — usado no modo difícil da Prova pra
  # bloquear início/continuação enquanto detectar Wi-Fi/dados móveis
  # ativos.
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env